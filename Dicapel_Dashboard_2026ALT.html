<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Dicapel — Vendas 2026</title>
<style>
:root{--az:#1F3864;--az2:#2F5496;--az3:#D9E1F2;--vd:#375623;--vd2:#E2EFDA;--vm:#9C0006;--vm2:#FCE4D6;--bg:#f0f4fa;--card:#fff;--borda:#e4eaf4;--txt:#1a2340;--sub:#5a6a8a}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
#login{position:fixed;inset:0;background:var(--az);display:flex;align-items:center;justify-content:center;z-index:999;padding:24px}
.lbox{background:#fff;border-radius:20px;padding:32px 24px;width:100%;max-width:340px;text-align:center}
.logo{font-size:42px;margin-bottom:12px}
.lbox h2{color:var(--az);font-size:20px;font-weight:800;margin-bottom:6px}
.lbox p{color:var(--sub);font-size:13px;margin-bottom:24px;line-height:1.5}
.linput{width:100%;padding:13px 16px;border:2px solid var(--borda);border-radius:12px;font-size:16px;outline:none;margin-bottom:12px;transition:border .2s}
.linput:focus{border-color:var(--az2)}
.lbtn{width:100%;padding:14px;background:var(--az);color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer}
.lbtn:active{background:var(--az2)}
.lerr{color:#c0392b;font-size:12px;margin-top:8px;min-height:16px}
#app{display:none;min-height:100vh}
.hdr{background:var(--az);padding:14px 16px 10px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.hdr h1{color:#fff;font-size:17px;font-weight:700}
.hdr p{color:#9bb3d4;font-size:11px;margin-top:2px}
.mbar{background:#fff;border-bottom:1px solid var(--borda);overflow-x:auto;white-space:nowrap;padding:10px 12px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.mbar::-webkit-scrollbar{display:none}
.mpill{display:inline-block;padding:7px 15px;margin-right:6px;border-radius:20px;border:2px solid var(--borda);background:#fff;color:var(--sub);font-size:13px;font-weight:600;cursor:pointer;transition:all .15s}
.mpill.on{color:#fff;border-color:transparent}
.tabs{background:#fff;border-bottom:2px solid var(--borda);display:flex;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:11px 15px;font-size:13px;font-weight:600;color:var(--sub);cursor:pointer;border-bottom:2.5px solid transparent;white-space:nowrap;flex-shrink:0;transition:all .15s;margin-bottom:-2px}
.tab.on{color:var(--az2);border-bottom-color:var(--az2)}
.content{padding:14px 12px 32px}
.sec{display:none}.sec.on{display:block}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.card{background:var(--card);border-radius:14px;padding:14px 13px;box-shadow:0 1px 5px rgba(0,0,0,.07)}
.card.full{grid-column:1/-1}
.clbl{font-size:10px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px}
.cval{font-size:19px;font-weight:800;color:var(--az);line-height:1.1}
.cval.sm{font-size:15px}
.csub{font-size:11px;color:var(--sub);margin-top:4px}
.bdg{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700}
.bdg.up{background:var(--vd2);color:var(--vd)}.bdg.dn{background:var(--vm2);color:var(--vm)}
.stitle{font-size:13px;font-weight:700;color:var(--az);padding:10px 0 8px;border-bottom:2px solid var(--az3);margin-bottom:10px}
.blist{background:var(--card);border-radius:14px;overflow:hidden;box-shadow:0 1px 5px rgba(0,0,0,.07);margin-bottom:14px}
.bitem{padding:11px 13px;border-bottom:1px solid var(--borda)}
.bitem:last-child{border-bottom:none}
.brow{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.bname{font-size:12px;font-weight:600;color:var(--txt);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:8px}
.bval{font-size:12px;font-weight:700;color:var(--az2);white-space:nowrap}
.btrack{height:5px;background:var(--az3);border-radius:3px;overflow:hidden}
.bfill{height:100%;border-radius:3px;transition:width .35s}
.bpct{font-size:10px;color:var(--sub);margin-top:3px}
.tog{display:flex;background:var(--az3);border-radius:10px;padding:3px;margin-bottom:12px}
.tbtn{flex:1;padding:7px;text-align:center;border-radius:8px;font-size:12px;font-weight:600;color:var(--sub);cursor:pointer;transition:all .15s}
.tbtn.on{background:#fff;color:var(--az2);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.ufgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.ufcard{background:var(--card);border-radius:12px;padding:11px 13px;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.ufname{font-size:16px;font-weight:800;color:var(--az)}
.ufval{font-size:13px;font-weight:600;margin:3px 0}
.ufpct{font-size:11px;color:var(--sub)}
.evowrap{background:var(--card);border-radius:14px;padding:16px;box-shadow:0 1px 5px rgba(0,0,0,.07);margin-bottom:14px}
.evotitle{font-size:11px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}
.chart{position:relative;height:90px;display:flex;align-items:flex-end;gap:3px;padding-bottom:20px}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;cursor:pointer}
.bbar{width:100%;border-radius:4px 4px 0 0;min-height:3px;transition:opacity .2s}
.bbar.cur{box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--az2)}
.blbl{font-size:9px;color:var(--sub);font-weight:600;position:absolute;bottom:0;left:50%;transform:translateX(-50%);white-space:nowrap}
.cmprow{display:flex;gap:8px;margin-bottom:14px}
.cmpcard{flex:1;background:var(--card);border-radius:12px;padding:12px 8px;box-shadow:0 1px 4px rgba(0,0,0,.07);text-align:center}
.cmplbl{font-size:9px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.4px}
.cmpval{font-size:14px;font-weight:800;color:var(--az);margin:4px 0 3px}
.cmpvar{font-size:12px;font-weight:700}
.cmpvar.up{color:var(--vd)}.cmpvar.dn{color:var(--vm)}
</style>
</head>
<body>
<div id="login">
  <div class="lbox">
    <div class="logo">📦</div>
    <h2>Dicapel Vendas 2026</h2>
    <p>Dashboard restrito de vendas.<br>Digite a senha para acessar.</p>
    <input class="linput" type="password" id="pwd" placeholder="Senha"
           onkeydown="if(event.key==='Enter')doLogin()">
    <button class="lbtn" onclick="doLogin()">Entrar</button>
    <div class="lerr" id="err"></div>
  </div>
</div>
<div id="app">
  <div class="hdr"><h1>📦 Dicapel — Vendas 2026</h1><p id="hsub">Selecione um mês</p></div>
  <div class="mbar" id="mbar"></div>
  <div class="tabs">
    <div class="tab on"  onclick="setTab('resumo',this)">Resumo</div>
    <div class="tab" onclick="setTab('familias',this)">Famílias</div>
    <div class="tab" onclick="setTab('reps',this)">Representantes</div>
    <div class="tab" onclick="setTab('estados',this)">Estados</div>
    <div class="tab" onclick="setTab('clientes',this)">Clientes</div>
    <div class="tab" onclick="setTab('evolucao',this)">Evolução</div>
  </div>
  <div class="content">
    <div class="sec on" id="sec-resumo"></div>
    <div class="sec" id="sec-familias"></div>
    <div class="sec" id="sec-reps"></div>
    <div class="sec" id="sec-estados"></div>
    <div class="sec" id="sec-clientes"></div>
    <div class="sec" id="sec-evolucao"></div>
  </div>
</div>

const MESES=Object.keys(RAW);
const CORES=['#2F5496','#1A5276','#145A32','#6E2F8A','#7D6608','#AE0000','#006064','#784212'];
let mes=MESES[MESES.length-1],tab='resumo',met='peso';

function doLogin(){
  const v=document.getElementById('pwd').value;
  if(v===SK){
    document.getElementById('login').style.display='none';
    document.getElementById('app').style.display='block';
    init();
  } else {
    const e=document.getElementById('err');
    e.textContent='Senha incorreta. Tente novamente.';
    document.getElementById('pwd').value='';
    setTimeout(()=>e.textContent='',3000);
  }
}

function fkg(v){return (v/1000).toFixed(1).replace('.',',')+' t';}
function fR(v){return 'R$ '+(v/1e6).toFixed(2).replace('.',',')+' M';}
function fpct(v){return (v>=0?'+':'')+v.toFixed(1)+'%';}
function vc(v){return v>=0?'up':'dn';}
function pv(a,b){return a>0?(b-a)/a*100:0;}

function init(){buildPills();render();}

function buildPills(){
  document.getElementById('mbar').innerHTML=MESES.map((m,i)=>
    '<div class="mpill '+(m===mes?'on':'')+'" onclick="setMes(\''+m+'\')"'+
    (m===mes?' style="background:'+CORES[i]+'"':'')+'>'+m+'</div>'
  ).join('');
}

function setMes(m){mes=m;buildPills();render();}

function setTab(t,el){
  tab=t;
  document.querySelectorAll('.tab').forEach(e=>e.classList.remove('on'));
  el.classList.add('on');
  document.querySelectorAll('.sec').forEach(e=>e.classList.remove('on'));
  document.getElementById('sec-'+t).classList.add('on');
  render();
}

function setMet(m){met=m;render();}

function render(){
  const d=RAW[mes],idx=MESES.indexOf(mes),cor=CORES[idx];
  const ant=idx>0?RAW[MESES[idx-1]]:null;
  document.getElementById('hsub').textContent=mes+' 2026';
  if(tab==='resumo')   rResumo(d,ant,cor,idx);
  if(tab==='familias') rList('sec-familias',d.fam,d.tp,d.tv,cor);
  if(tab==='reps')     rList('sec-reps',d.rep,d.tp,d.tv,cor);
  if(tab==='estados')  rEstados(d,cor);
  if(tab==='clientes') rList('sec-clientes',d.cli,d.tp,d.tv,cor);
  if(tab==='evolucao') rEvo(cor,idx);
}

function badge(v){return '<span class="bdg '+vc(v)+'">'+fpct(v)+'</span>';}

function rResumo(d,ant,cor,idx){
  const vp=ant?pv(ant.tp,d.tp):null,vv=ant?pv(ant.tv,d.tv):null,vpm=ant?pv(ant.pm,d.pm):null;
  const ac_tp=MESES.slice(0,idx+1).reduce((s,m)=>s+RAW[m].tp,0);
  const ac_tv=MESES.slice(0,idx+1).reduce((s,m)=>s+RAW[m].tv,0);
  const cp=d.tp>0?d.com_p/d.tp*100:0, ip=d.tp>0?d.imu_p/d.tp*100:0;
  const antLbl=ant?MESES[MESES.indexOf(mes)-1]:'';
  let h='<div class="cards">'
    +'<div class="card"><div class="clbl">Volume</div><div class="cval">'+fkg(d.tp)+'</div>'
    +'<div class="csub">'+(vp!==null?badge(vp)+' vs '+antLbl:'&nbsp;')+'</div></div>'
    +'<div class="card"><div class="clbl">Faturamento</div><div class="cval sm">'+fR(d.tv)+'</div>'
    +'<div class="csub">'+(vv!==null?badge(vv)+' vs '+antLbl:'&nbsp;')+'</div></div>'
    +'<div class="card"><div class="clbl">Preço Médio</div><div class="cval sm">R$ '+d.pm.toFixed(2).replace('.',',')+'/kg</div>'
    +'<div class="csub">'+(vpm!==null?badge(vpm)+' vs '+antLbl:'&nbsp;')+'</div></div>'
    +'<div class="card"><div class="clbl">Acumulado '+mes+'</div><div class="cval sm">'+fR(ac_tv)+'</div>'
    +'<div class="csub">'+fkg(ac_tp)+' acumulado</div></div>'
    +'</div>';
  h+='<div class="stitle">Comercial vs Imune</div><div class="cards" style="margin-bottom:14px">'
    +'<div class="card" style="border-top:3px solid '+cor+'">'
    +'<div class="clbl">Comercial</div><div class="cval sm">'+fkg(d.com_p)+'</div>'
    +'<div class="csub">'+cp.toFixed(1).replace('.',',')+'% do total</div>'
    +'<div class="btrack" style="margin-top:8px"><div class="bfill" style="width:'+cp+'%;background:'+cor+'"></div></div></div>'
    +'<div class="card" style="border-top:3px solid #784212">'
    +'<div class="clbl">Imune</div><div class="cval sm">'+fkg(d.imu_p)+'</div>'
    +'<div class="csub">'+ip.toFixed(1).replace('.',',')+'% do total</div>'
    +'<div class="btrack" style="margin-top:8px"><div class="bfill" style="width:'+ip+'%;background:#784212"></div></div></div></div>';
  if(ant){
    h+='<div class="stitle">Comparativo vs '+antLbl+'</div><div class="cmprow">'
      +'<div class="cmpcard"><div class="cmplbl">Peso</div><div class="cmpval">'+fkg(d.tp)+'</div>'
      +'<div class="cmpvar '+vc(vp)+'">'+fpct(vp)+'</div></div>'
      +'<div class="cmpcard"><div class="cmplbl">Valor</div><div class="cmpval">'+fR(d.tv)+'</div>'
      +'<div class="cmpvar '+vc(vv)+'">'+fpct(vv)+'</div></div>'
      +'<div class="cmpcard"><div class="cmplbl">PM/kg</div><div class="cmpval">R$ '+d.pm.toFixed(2).replace('.',',')+'</div>'
      +'<div class="cmpvar '+vc(vpm)+'">'+fpct(vpm)+'</div></div></div>';
  }
  document.getElementById('sec-resumo').innerHTML=h;
}

function rList(id,items,tp,tv,cor){
  const useP=met==='peso',tot=useP?tp:tv;
  const maxV=items.reduce((m,x)=>Math.max(m,useP?x[1]:x[2]),0);
  let h='<div class="tog">'
    +'<div class="tbtn '+(met==='peso'?'on':'')+'" onclick="setMet(\'peso\')">⚖️ Peso (t)</div>'
    +'<div class="tbtn '+(met==='valor'?'on':'')+'" onclick="setMet(\'valor\')">💰 Valor (R$)</div>'
    +'</div><div class="blist">';
  items.forEach(function(item){
    const val=useP?item[1]:item[2];
    const pct=tot>0?val/tot*100:0,barW=maxV>0?val/maxV*100:0;
    h+='<div class="bitem"><div class="brow">'
      +'<div class="bname">'+item[0]+'</div>'
      +'<div class="bval">'+(useP?fkg(val):fR(val))+'</div></div>'
      +'<div class="btrack"><div class="bfill" style="width:'+barW+'%;background:'+cor+'"></div></div>'
      +'<div class="bpct">'+pct.toFixed(1).replace('.',',')+'% do total</div></div>';
  });
  h+='</div>';
  document.getElementById(id).innerHTML=h;
}

function rEstados(d,cor){
  const useP=met==='peso';
  let h='<div class="tog">'
    +'<div class="tbtn '+(met==='peso'?'on':'')+'" onclick="setMet(\'peso\')">⚖️ Peso (t)</div>'
    +'<div class="tbtn '+(met==='valor'?'on':'')+'" onclick="setMet(\'valor\')">💰 Valor (R$)</div>'
    +'</div><div class="ufgrid">';
  d.uf.forEach(function(uf){
    const val=useP?uf[1]:uf[2],tot=useP?d.tp:d.tv;
    const pct=tot>0?val/tot*100:0;
    h+='<div class="ufcard"><div class="ufname">'+(uf[0]||'—')+'</div>'
      +'<div class="ufval">'+(useP?fkg(val):fR(val))+'</div>'
      +'<div class="ufpct">'+pct.toFixed(1).replace('.',',')+'%</div>'
      +'<div class="btrack" style="margin-top:6px"><div class="bfill" style="width:'+pct+'%;background:'+cor+'"></div></div></div>';
  });
  h+='</div>';
  document.getElementById('sec-estados').innerHTML=h;
}

function rEvo(cor,curIdx){
  const useP=met==='peso';
  const vals=MESES.map(function(m){return useP?RAW[m].tp:RAW[m].tv;});
  const maxV=Math.max.apply(null,vals);
  const ac_tp=MESES.reduce(function(s,m){return s+RAW[m].tp;},0);
  const ac_tv=MESES.reduce(function(s,m){return s+RAW[m].tv;},0);

  let bars='';
  MESES.forEach(function(m,i){
    const h=maxV>0?vals[i]/maxV*88:0;
    bars+='<div class="bcol" onclick="setMes(\''+m+'\')"><div class="bbar '+(i===curIdx?'cur':'')+'"'
      +' style="height:'+h+'%;background:'+CORES[i]+';opacity:'+(i===curIdx?1:0.5)+'"></div>'
      +'<span class="blbl">'+m+'</span></div>';
  });

  let tbl='';
  MESES.forEach(function(m,i){
    const v=vals[i],ant2=i>0?vals[i-1]:null;
    const vr=ant2!==null?pv(ant2,v):null;
    tbl+='<div class="bitem"'+(i===curIdx?' style="background:#f0f4ff"':'')+'><div class="brow">'
      +'<div class="bname"'+(i===curIdx?' style="color:'+CORES[i]+';font-size:13px;font-weight:800"':'')+'>'
      +m+' 2026</div>'
      +'<div style="display:flex;align-items:center;gap:8px">'
      +'<div class="bval">'+(useP?fkg(v):fR(v))+'</div>'
      +(vr!==null?badge(vr):'')
      +'</div></div></div>';
  });

  let h='<div class="tog">'
    +'<div class="tbtn '+(met==='peso'?'on':'')+'" onclick="setMet(\'peso\')">⚖️ Peso (t)</div>'
    +'<div class="tbtn '+(met==='valor'?'on':'')+'" onclick="setMet(\'valor\')">💰 Valor (R$)</div>'
    +'</div>'
    +'<div class="evowrap"><div class="evotitle">'+(useP?'Volume (t)':'Faturamento (R$)')+' — toque para navegar</div>'
    +'<div class="chart">'+bars+'</div></div>'
    +'<div class="stitle">Mês a Mês</div>'
    +'<div class="blist" style="margin-bottom:14px">'+tbl+'</div>'
    +'<div class="cards">'
    +'<div class="card"><div class="clbl">Acumulado Volume</div><div class="cval sm">'+fkg(ac_tp)+'</div></div>'
    +'<div class="card"><div class="clbl">Acumulado Valor</div><div class="cval sm">'+fR(ac_tv)+'</div></div>'
    +'</div>';
  document.getElementById('sec-evolucao').innerHTML=h;
}
</script>
